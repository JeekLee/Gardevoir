[project]
name = "gateway"
version = "0.1.0"
description = "gardevoir gateway BC: OpenAI-compatible guardrail proxy"
requires-python = ">=3.12"
dependencies = [
    "shared-kernel",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary,pool]>=3.3.4",
    "clickhouse-connect>=1.7.0",
    "pydantic-settings>=2.3",
    "python-ulid>=3.0",
    "google-re2>=1.1",
]

[project.scripts]
gardevoir-createkey = "gateway.cli:createkey"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "respx>=0.23.1",
    "openai>=3.0.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # 프레임워크가 폐기한 API를 쓰면 즉시 실패한다. 조용히 남겨두면
    # 다음 메이저 업그레이드에서 한꺼번에 터진다.
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
    "error::DeprecationWarning:gateway",
]
