[project]
name = "gateway"
version = "0.1.0"
description = "gardevoir gateway BC: OpenAI-compatible guardrail proxy"
requires-python = ">=3.14"
dependencies = [
    "shared-kernel",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary,pool]>=3.3.4",
    "clickhouse-connect>=1.7.0",
    "pydantic-settings>=2.3",
    "python-ulid>=3.0",
    "google-re2>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "respx>=0.23.1",
    "openai>=3.0.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
# ruff 는 설정을 병합하지 않고 가장 가까운 것만 쓴다. extend 가 없으면 워크스페이스
# 루트의 line-length·lint.select 를 잃고 기본값으로 떨어진다.
extend = "../pyproject.toml"
# alembic/versions 는 순수 생성물이다. 우리가 손대는 alembic/env.py 는 린트한다.
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # 프레임워크가 폐기한 API를 쓰면 즉시 실패한다. 조용히 남겨두면
    # 다음 메이저 업그레이드에서 한꺼번에 터진다.
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
    "error::DeprecationWarning:gateway",
]
