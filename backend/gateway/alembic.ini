[postgres]
script_location = %(here)s/alembic/postgres
prepend_sys_path = .
path_separator = os
# Alembic 의 year 토큰은 네 자리뿐이라 env.py 가 생성 경로에서 앞 두 자리를 줄인다.
file_template = %%(year).2d%%(month).2d%%(day).2d_%%(slug)s
revision_environment = true
sqlalchemy.url =

[clickhouse]
script_location = %(here)s/alembic/clickhouse
prepend_sys_path = .
path_separator = os
# Alembic 의 year 토큰은 네 자리뿐이라 env.py 가 생성 경로에서 앞 두 자리를 줄인다.
file_template = %%(year).2d%%(month).2d%%(day).2d_%%(slug)s
revision_environment = true
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
