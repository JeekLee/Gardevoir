[project]
name = "shared-kernel"
version = "0.1.0"
description = "Cross-cutting building blocks shared by gardevoir bounded contexts"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "clickhouse-connect>=1.7.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.3",
    "orjson>=3.11.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "httpx>=0.28.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_kernel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # 프레임워크가 폐기한 API를 쓰면 즉시 실패한다. 조용히 남겨두면
    # 다음 메이저 업그레이드에서 한꺼번에 터진다.
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
    "error::DeprecationWarning:shared_kernel",
]
